idden="true">chevron_right</span></button></div>

<script>const FID="export";const AMT="85";const LEGAL={"privacy":["Privacy notice (outline)",["Who we are: the HeronPay hackathon team. Contact: team email (placeholder).","What we collect: student number, full name, a SHA-256 hash of the ID chip UID, a hash of the PIN (never the PIN), and receipts (amount, stall, time).","Why: to load credits, accept payments, settle them, set offline limits and detect cloned IDs.","On-chain: settled payments are public and permanent on Polygon Amoy. They show wallet addresses and amounts, not names.","AI: receipts are scored for offline limits and fraud. The assistant sends your receipts to an AI service only when you ask it something.","How long: until the demo ends (placeholder, team to confirm).","Your rights under the Data Privacy Act of 2012 (RA 10173): access, correction, and deletion of off-chain data."]],"terms":["Terms of use (outline)",["TagakPeso (tPHP) is a testnet token with no cash value. There is no cash-out.","The demo may be reset at any time.","A payment accepted offline can fail at settlement if the balance is short.","Keep your PIN private. Report a lost ID to the cashier.","Not affiliated with or endorsed by the University of Makati."]],"data":["Data requests (outline)",["Email the team (placeholder address) with your student number.","We can show, correct, or delete your off-chain record: name, student number, hashes, receipts.","Settled payments on the blockchain cannot be deleted. Deleting your record unlinks your name from that address."]],"cookies":["Cookies and storage (outline)",["Essential storage only: your login on this phone, the offline receipt queue, and the cached student list on stall phones.","No analytics or advertising cookies, so there is no cookie banner. If analytics is added later, a consent bar with Accept, Reject and Customize comes with it."]],"disclaimer":["Disclaimer (outline)",["HeronPay is a student hackathon project and is not affiliated with or endorsed by the University of Makati.","Testnet only. No real money moves.","A real pilot needs university approval and BSP review."]],"team":["About the team (placeholder)",["Four builders: contract, API and AI, stall POS, cashier and student screens. Names to be added by the team."]]};
function post(m){if(m.go)location.href=m.go+'.html'}
let amt=AMT;const fmt=v=>'\u20b1'+Number(v||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
function showAmt(){document.querySelectorAll('[data-amt]').forEach(e=>e.textContent=fmt(amt))}
let pins=0,demo=0,page=0;
function openLegal(key){const L=LEGAL[key];if(!L)return;const o=document.getElementById('legal');o.querySelector('h2').textContent=L[0];o.querySelector('ul').innerHTML=L[1].map(x=>'<li>'+x+'</li>').join('');o.hidden=false;o.querySelector('[data-close]').focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=document.getElementById('legal');if(o)o.hidden=true}});
document.addEventListener('click',e=>{
  const l=e.target.closest('[data-legal]');if(l){e.preventDefault();openLegal(l.dataset.legal);return}
  if(e.target.closest('[data-close]')||e.target.id==='legal'){document.getElementById('legal').hidden=true;return}
  const lg=e.target.closest('[data-lang]');if(lg){post({lang:lg.dataset.lang});return}
  const dn=e.target.closest('[data-demo-next]');if(dn){demo=(demo+1)%4;document.querySelectorAll('[data-demo-show]').forEach(x=>x.hidden=+x.dataset.demoShow!==demo);document.querySelectorAll('[data-demo-pip]').forEach(x=>{const on=+x.dataset.demoPip<=demo;x.classList.toggle('bg-primary',on);x.classList.toggle('bg-surface-container-highest',!on)});return}
  const inx=e.target.closest('[data-intro-next]');if(inx){page=Math.min(2,page+1);document.querySelectorAll('[data-page]').forEach(x=>x.hidden=+x.dataset.page!==page);document.querySelectorAll('[data-pager]').forEach(x=>{const on=+x.dataset.pager===page;x.className='h-2 rounded-full '+(on?'w-6 bg-primary':'w-2 bg-outline-variant')});if(page===2){inx.hidden=true;document.querySelector('[data-intro-start]').hidden=false}return}
  const q=e.target.closest('[data-quick]');if(q){amt=q.dataset.quick;showAmt();return}
  const k=e.target.closest('[data-key]');if(k){const x=k.dataset.key;if(x==='C')amt='0';else if(x==='backspace')amt=amt.slice(0,-1)||'0';else amt=(amt==='0'?'':amt)+x;if(amt.length>5)amt=amt.slice(0,5);showAmt();return}
  const p=e.target.closest('[data-pin]');if(p){const dots=document.querySelectorAll('[data-dot]');if(p.dataset.pin==='backspace'){pins=Math.max(0,pins-1)}else{pins=Math.min(4,pins+1)}dots.forEach((d,i)=>d.style.background=i<pins?'var(--on-surface)':'transparent');if(pins===4)setTimeout(()=>post({go:'pos-approved'}),250);return}
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();const m={go:g.dataset.go};if(g.hasAttribute('data-charge'))m.amt=amt;post(m);return}
  const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();const id=a.getAttribute('href');const t=id.length>1?document.querySelector(id):null;if(t)t.scrollIntoView()}
});
function rep(){post({h:document.documentElement.scrollHeight})}
window.addEventListener('load',()=>{rep();setTimeout(rep,300);setTimeout(rep,1200);setTimeout(rep,2500)});
</script></body></html>

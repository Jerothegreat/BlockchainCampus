/* Shell: sticky control bar, screen list left, canvas of real-width iframes right. */
:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --s-bg: #0C0F15; --s-panel: #141922; --s-line: #283041; --s-fg: #E8ECF4; --s-muted: #9AA3B6;

:root[data-theme="dark"] {

html, body { height: 100%; }
body { background: var(--s-bg); color: var(--s-fg); font: 14px/1.45 var(--s-sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--s-panel); }
::selection { background: var(--s-accent); color: var(--s-accent-ink); }
button, select { font: inherit; color: inherit; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--s-panel); border-bottom: 1px solid var(--s-line);

.bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font: 600 15px/1.2 var(--s-display); }
.brand span { color: var(--s-muted); font-size: 12px; }
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl > span { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--s-muted); }
.seg { display: inline-flex; background: var(--s-chip); border-radius: 8px; padding: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--s-accent); color: var(--s-accent-ink); font-weight: 700; }
.seg button:focus-visible, .scr:focus-visible, .fnode:focus-visible, select:focus-visible { outline: 2px solid var(--s-accent); outline-offset: 2px; }
.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: calc(100% - 60px); }
.side { border-right: 1px solid var(--s-line); padding: 6px 10px 40px max(10px, env(safe-area-inset-left, 0px)); background: var(--s-panel); }
.side h4 { margin: 16px 8px 4px; font: 600 12px/1.3 var(--s-display); color: var(--s-muted); }
.scr { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.scr:hover { background: var(--s-chip); }
.scr[aria-current="true"] { background: var(--s-accent); color: var(--s-accent-ink); font-weight: 700; }

.frame { min-width: 0; max-width: 100%; }
.frame-cap { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 12px; color: var(--s-muted); margin-bottom: 6px; }
.frame-cap b { color: var(--s-fg); font: 600 13px/1.2 var(--s-display); }
.frame-scroll { max-width: 100%; overflow-x: auto; }

.clip iframe { border: 0; display: block; transform-origin: 0 0; }

.dircard { background: var(--s-panel); border: 1px solid var(--s-line); border-radius: 8px; padding: 12px 14px; }

.edge svg { width: 16px; height: 16px; flex: none; }
.tok-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.tok { background: var(--s-panel); border: 1px solid var(--s-line); border-radius: 8px; padding: 14px; min-width: 0; }

.sw code, .kv code { font-family: var(--s-mono); font-size: 11.5px; color: var(--s-muted); }

.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; margin: 0; }

/* ===================== COLOR SCHEMES (M3 roles) ===================== */
const hx = (h) => { h = h.replace('#', ''); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); };
const toHex = (a) => '#' + a.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('').toUpperCase();
const mix = (a, b, t) => { const A = hx(a), B = hx(b); return toHex(A.map((v, i) => v + (B[i] - v) * t)); };
const ROLES = ['primary', 'secondary', 'tertiary', 'error', 'success', 'warning'];
function scheme(s, mode) {
  const dark = mode === 'dark', bg = s.bg, fg = s.fg, o = {};
  o.surface = bg; o['on-surface'] = fg;
  o['surface-container-lowest'] = dark ? mix(bg, '#000000', 0.35) : '#FFFFFF';
  o['surface-container-low'] = mix(bg, fg, dark ? 0.035 : 0.025);
  o['surface-container'] = mix(bg, fg, dark ? 0.06 : 0.045);
  o['surface-container-high'] = mix(bg, fg, dark ? 0.09 : 0.07);
  o['surface-container-highest'] = mix(bg, fg, dark ? 0.13 : 0.095);
  o['on-surface-variant'] = mix(fg, bg, dark ? 0.28 : 0.3);
  o.outline = mix(fg, bg, dark ? 0.5 : 0.48);
  o['outline-variant'] = mix(fg, bg, dark ? 0.78 : 0.8);
  for (const r of ROLES) {
    const R = r[0].toUpperCase() + r.slice(1);
    o[r] = s[r]; o['on-' + r] = s['on' + R];
    o[r + '-container'] = s[r + 'Container'] || (dark ? mix(s[r], bg, 0.72) : mix(s[r], '#FFFFFF', 0.82));
    o['on-' + r + '-container'] = s['on' + R + 'Container'] || (dark ? mix(s[r], fg, 0.4) : mix(s[r], '#000000', 0.55));
  }
  o['inverse-surface'] = mix(fg, bg, 0.06);
  o['inverse-on-surface'] = mix(bg, fg, 0.08);
  o['inverse-primary'] = dark ? mix(s.primary, '#000000', 0.55) : (s.primaryContainer || mix(s.primary, '#FFFFFF', 0.5));
  o.scrim = '#000000';
  o.cta = dark ? o.primary : o['primary-container'];
  o['on-cta'] = dark ? o['on-primary'] : o['on-primary-container'];
  if (s.paper) { o.paper = s.paper; o['on-paper'] = s.onPaper; o['paper-muted'] = mix(s.onPaper, s.paper, 0.38); o.stamp = '#146C43'; o['stamp-pending'] = '#2E4FB8'; }
  return o;
}

function qr(seed = 7, cls = 'w-40 h-40') {
  const n = 25; let s = seed * 9301 + 49297; const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  let r = '';
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#FFFFFF"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
  const inF = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!inF(x, y) && rnd() > 0.52) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  return `<svg class="${cls}" viewBox="-2 -2 29 29" role="img" aria-label="Receipt QR code, sample" style="background:#FFFFFF;fill:#000000" shape-rendering="crispEdges">${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}${r}</svg>`;
}
